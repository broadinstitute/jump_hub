project:
    type: website
    output-dir: docs
    post-render:
        - tools/fix_source_links.py
# author: Alán F. Muñoz
# date: last-modified

language:
    search-text-placeholder: Search

website:
    title: "JUMP documentation and examples"
    repo-url: https://github.com/broadinstitute/jump_hub
    repo-actions: [edit, source, issue]
    reader-mode: true
    search:
        location: sidebar
        type: overlay
    sidebar:
        style: "floating"
        collapse-level: 1
        contents:
            - text: Home
              file: index.md
            - text: Announcements
              file: announcements.md
            - section: Explanations
              contents:
                  - auto: "explanations/*"
            - section: Reference
              contents:
                  - auto: "reference/*"
            - section: "How-To: Notebooks"
              contents:
                  - auto: "howto/notebooks/*"
            - section: "How-To: Interactive Tools"
              contents:
                  - auto: "howto/interactive/*"
            - section: "For maintainers"
              contents:
                  - auto: "howto/maintenance/*"
            - text: Cite
              file: cite.md
        tools:
            - icon: github
              href: https://github.com/broadinstitute/jump_hub

format:
    html:
        default-image-extension: svg
        toc: true
        theme:
            light: flatly
            dark: darkly
        code-fold: false
    ipynb:
        default-image-extension: svg
